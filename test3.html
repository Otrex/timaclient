<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
<style>
  body {
    background: lightgray;
  }
  .menu-item {
    display: inline-block;
    width: 40px;
    height: 40px;
    background-color: white;
    margin: 5px;
    text-align: center;
    line-height: 40px;
    cursor: pointer;
    user-select: none;
    transform: scale(1);
  }

  .draggable {
    background-color: yellow;
    transform: scale(1.2);
  }

  #log {
  }
</style>
<div id="container"></div>

<div id="log"></div>

<script>
  var t;
  $(document).on("mousedown touchstart", ".menu-item", function (event) {
    event.preventDefault();
    var self = this;
    if ($(self).hasClass("draggable")) {
      return;
    }
    t = setTimeout(function () {
      $(self)
        .draggable({
          start: function () {
            console.log("start drag");
          },
        })
        .draggable("enable")
        .addClass("draggable");
      if (event.type === "touchstart") {
        var touch = event.originalEvent.touches[0];
        $(self).trigger(
          $.Event("mousedown", {
            pageX: touch.pageX,
            pageY: touch.pageY,
          })
        );
      }
    }, 800);
  });

  $(document).on("mouseup touchend", function () {
    clearTimeout(t);
    $(".draggable").removeClass("draggable").draggable("disable");
  });

  $(document).on("contextmenu", function (event) {
    event.preventDefault();
  });

  $(function () {
    $("#container").append('<div class="menu-item">1</div>');
    $("#container").append('<div class="menu-item">2</div>');
    $("#container").append('<div class="menu-item">3</div>');
    $("#container").append('<div class="menu-item">4</div>');
    $("#container").append('<div class="menu-item">5</div>');
  });
</script>
