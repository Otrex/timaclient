<style>
  .fade-in {
    opacity: 0; /* Start with opacity 0 */
    animation: fadeInAnimation 0.5s ease-in forwards; /* Apply the animation */
  }

  .box {
    width: 200px;
    height: 200px;
    background-color: green;
  }

  @keyframes fadeInAnimation {
    from {
      opacity: 0; /* Start with opacity 0 */
    }
    to {
      opacity: 1; /* End with opacity 1 */
    }
  }
</style>

<div class="fade-in box">Content to fade in</div>
