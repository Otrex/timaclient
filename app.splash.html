<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .abs-screen {
        width: 100%;
        height: 100vh;
      }
      .abs-center {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .tima-loader {
        text-align: center;
      }

      .tima-loader img {
        width: 150px;
        height: auto;
        animation: logoAnimation 2s ease-in-out infinite;
      }

      .tima-loader span {
        text-transform: uppercase;
        letter-spacing: 0.7em;
        font-weight: bold;
        font-family: sans-serif;
      }

      @keyframes logoAnimation {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
        }
      }
    </style>
  </head>
  <body>
    <div class="abs-center abs-screen">
      <div class="tima-loader">
        <div>
          <img src="/app.ico.png" alt="icon" />
        </div>
        <span> loading </span>
      </div>
    </div>
  </body>
</html>
